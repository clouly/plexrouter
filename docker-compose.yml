services:
  plexrouter:
    image: ghcr.io/clouly/plexrouter:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      PLEXROUTER_NAME: PlexRouter
      # PLEXROUTER_SECRET: change-me-to-a-long-random-string
      # PLEXROUTER_ADMIN_EMAIL: admin@example.com
      # PLEXROUTER_ADMIN_PASSWORD: change-me
      # PLEXROUTER_ALLOW_REGISTER: "false"
      # PLEXROUTER_TRUST_PROXY: "true"
